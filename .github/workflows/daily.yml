name: Daily Discovery

on:
  schedule:
    - cron: '0 12 */2 * *'  # Noon UTC every 2 days
  workflow_dispatch:          # Manual trigger

# Prevent concurrent runs on the same branch
concurrency:
  group: daily-discovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    # Only run on default branch — never on feature branches
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      # ── Setup ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      # ── Pipeline ─────────────────────────────────────────────────────
      - name: Run pipeline
        id: pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -m src.main --limit 1

      # ── Commit changes ───────────────────────────────────────────────
      - name: Commit discovered post
        id: commit
        if: success()
        continue-on-error: true   # Non-critical: no changes is fine
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit — skipping."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            POST_TITLE=$(python -c "
          import json
          try:
              with open('data/posts.json') as f:
                  posts = json.load(f)
              print(posts[-1].get('title', 'Unknown') if posts else 'No posts')
          except Exception:
              print('Unknown')
          ")

            git commit -m "Discover: ${POST_TITLE}"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "### Committed: Discover: ${POST_TITLE}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Deploy to Netlify ────────────────────────────────────────────
      - name: Deploy to Netlify
        id: deploy
        if: success()
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir=dist

      # ── Error summary (always runs) ──────────────────────────────────
      - name: Report pipeline status
        if: always()
        run: |
          echo "## Daily Discovery Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Step | Outcome |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|---------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pipeline | \`${{ steps.pipeline.outcome }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit   | \`${{ steps.commit.outcome }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Deploy   | \`${{ steps.deploy.outcome }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Trigger:** \`${{ github.event_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Ref:** \`${{ github.ref }}\`" >> "$GITHUB_STEP_SUMMARY"
